<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastFitters | Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sources/css/style.css">
</head>
<body>

  <!-- ========== NAVBAR ========== -->
  <header class="site-header">
    <nav class="navbar">
      <a href="index.html" class="logo">FAST<span>FITTERS</span></a>

      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html" class="nav-link">Home</a></li>

        <li class="has-dropdown">
          <a href="shop.html" class="nav-link">Shop</a>
          <ul class="dropdown">
            <li><a href="shop.html?category=all">View All</a></li>
            <li><a href="shop.html?category=vintage">Vintage</a></li>
            <li><a href="shop.html?category=streetwear">Streetwear</a></li>
            <li><a href="shop.html?category=jackets">Jackets</a></li>
            <li><a href="shop.html?category=hoodies">Hoodies &amp; Sweatshirts</a></li>
            <li><a href="shop.html?category=shirts">Shirts &amp; T-Shirts</a></li>
            <li><a href="shop.html?category=jeans">Jeans &amp; Trousers</a></li>
          </ul>
        </li>

        <li><a href="sell.html" class="nav-link">Sell</a></li>

        <li>
          <a href="cart.html" class="nav-link">Cart <span class="cart-count" id="cartCount">0</span></a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="section">
      <h1>Shop</h1>
      <div class="filters">
        <input id="search" type="search" placeholder="Search items" aria-label="Search items">
        <select id="category" aria-label="Category"><option value="all">All categories</option><option value="vintage">Vintage</option><option value="streetwear">Streetwear</option><option value="jackets">Jackets</option><option value="hoodies">Hoodies</option><option value="shirts">Shirts</option><option value="jeans">Jeans</option></select>
        <select id="size" aria-label="Size"><option value="all">All sizes</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
        <input id="maxPrice" type="number" min="0" placeholder="Max price (Rs)" aria-label="Maximum price">
        <select id="sort" aria-label="Sort"><option value="">Sort: newest</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select>
      </div>
      <p id="resultCount" class="meta"></p>
      <div class="grid" id="productGrid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>FastFitters: second-hand fashion by students, for students. ICT project, FAST-NUCES Karachi, Fall 2026.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/navbar.js"></script>
</body>
</html>
